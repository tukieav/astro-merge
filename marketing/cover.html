<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><style>html,body{margin:0;overflow:hidden;background:#53a9e8}canvas{display:block}</style></head>
<body>
<canvas id="cover"></canvas>
<script>
// Astro Merge submission art. One bright, readable composition adapts to each ratio.
const q = new URLSearchParams(location.search);
const W = parseInt(q.get('w') || '1920', 10), H = parseInt(q.get('h') || '1080', 10);
const square = q.get('sq') === '1', portrait = q.get('portrait') === '1';
const canvas = document.getElementById('cover'); canvas.width = W; canvas.height = H;
const g = canvas.getContext('2d'), U = Math.min(W, H) / 800;
function rgba(color, alpha) { return color.replace(')', `,${alpha})`).replace('rgb', 'rgba'); }
function glow(x, y, r, color, alpha = 1) { const p=g.createRadialGradient(x,y,0,x,y,r); p.addColorStop(0,rgba(color,alpha));p.addColorStop(.45,rgba(color,alpha*.32));p.addColorStop(1,rgba(color,0));g.fillStyle=p;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill(); }
function star(x,y,r,a) { g.fillStyle=`rgba(255,255,255,${a})`;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill(); if(r>1.4*U){g.strokeStyle=`rgba(255,250,218,${a*.7})`;g.lineWidth=Math.max(.8,U);g.beginPath();g.moveTo(x-r*3,y);g.lineTo(x+r*3,y);g.moveTo(x,y-r*3);g.lineTo(x,y+r*3);g.stroke();} }
let seed=61; function random(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;}
// Bright day-nebula field: intentionally no empty black areas.
const sky=g.createLinearGradient(0,0,W,H);sky.addColorStop(0,'#39b9ee');sky.addColorStop(.34,'#588ce8');sky.addColorStop(.7,'#9d72df');sky.addColorStop(1,'#f08a52');g.fillStyle=sky;g.fillRect(0,0,W,H);
for(const [x,y,r,c] of [[W*.10,H*.13,Math.max(W,H)*.42,'rgb(216,247,255)'],[W*.87,H*.27,Math.max(W,H)*.36,'rgb(255,202,102)'],[W*.55,H*.78,Math.max(W,H)*.48,'rgb(255,124,119)'],[W*.27,H*.66,Math.max(W,H)*.31,'rgb(132,241,236)']]) glow(x,y,r,c,.65);
g.save();g.globalAlpha=.20;for(let i=-2;i<=3;i++){const x=W*(.12+i*.22),beam=g.createLinearGradient(x,0,x+W*.18,H);beam.addColorStop(0,'rgba(255,255,255,.5)');beam.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=beam;g.beginPath();g.moveTo(x,0);g.lineTo(x+W*.12,0);g.lineTo(x+W*.40,H);g.lineTo(x+W*.23,H);g.closePath();g.fill();}g.restore();
for(const [x,y,rx,ry] of [[.13,.28,.17,.045],[.80,.14,.16,.04],[.14,.76,.19,.055],[.85,.72,.18,.05]]){const cl=g.createRadialGradient(W*x,H*y,0,W*x,H*y,W*rx);cl.addColorStop(0,'rgba(255,255,255,.42)');cl.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=cl;g.beginPath();g.ellipse(W*x,H*y,W*rx,H*ry,0,0,Math.PI*2);g.fill();}
for(let i=0;i<150;i++)star(random()*W,random()*H,(.55+random()*2.1)*U,.25+random()*.62);
function planet(x,y,r,top,bottom,kind,rotation){g.save();g.translate(x,y);g.rotate(rotation);const shadow=g.createRadialGradient(r*.16,r*.28,r*.12,r*.16,r*.28,r*1.33);shadow.addColorStop(0,'rgba(39,32,105,.34)');shadow.addColorStop(1,'rgba(39,32,105,0)');g.fillStyle=shadow;g.beginPath();g.arc(0,0,r*1.33,0,Math.PI*2);g.fill();const sphere=g.createRadialGradient(-r*.36,-r*.42,r*.06,r*.18,r*.22,r*1.12);sphere.addColorStop(0,'#ffffff');sphere.addColorStop(.12,top);sphere.addColorStop(.53,top);sphere.addColorStop(.82,bottom);sphere.addColorStop(1,'#3c438d');g.fillStyle=sphere;g.beginPath();g.arc(0,0,r,0,Math.PI*2);g.fill();g.save();g.beginPath();g.arc(0,0,r,0,Math.PI*2);g.clip();if(kind==='ocean'){g.fillStyle='rgba(55,194,122,.94)';for(const p of [[-.34,-.25,.30,.16,.55],[.28,.13,.28,.18,-.4],[.06,.47,.20,.13,.1],[-.48,.31,.14,.10,-.8]]){g.beginPath();g.ellipse(p[0]*r,p[1]*r,p[2]*r,p[3]*r,p[4],0,Math.PI*2);g.fill();}g.strokeStyle='rgba(229,255,255,.52)';g.lineWidth=r*.045;for(let i=-2;i<=2;i++){g.beginPath();g.arc(i*r*.22,-r*.10,r*.60,.18,1.2);g.stroke();}}else{g.strokeStyle='rgba(255,235,177,.46)';g.lineWidth=r*.11;for(let i=-3;i<=3;i++){g.beginPath();g.bezierCurveTo(-r,i*r*.23,-r*.30,i*r*.18+r*.08,r*.28,i*r*.26-r*.09,r,i*r*.20);g.stroke();}g.fillStyle='rgba(181,72,55,.54)';g.beginPath();g.ellipse(r*.27,r*.22,r*.20,r*.11,.24,0,Math.PI*2);g.fill();}const shine=g.createRadialGradient(-r*.38,-r*.43,0,-r*.28,-r*.31,r*.48);shine.addColorStop(0,'rgba(255,255,255,.88)');shine.addColorStop(.24,'rgba(255,255,255,.34)');shine.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=shine;g.beginPath();g.arc(-r*.22,-r*.22,r*.68,0,Math.PI*2);g.fill();g.restore();g.strokeStyle='rgba(255,255,255,.78)';g.lineWidth=Math.max(2,U*3.1);g.beginPath();g.arc(0,0,r-g.lineWidth*.5,-2.62,.45);g.stroke();g.restore();}
let heroY,leftX,rightX,radius,titleY;if(portrait){heroY=H*.62;leftX=W*.31;rightX=W*.70;radius=H*.205;titleY=H*.16;}else if(square){heroY=H*.62;leftX=W*.28;rightX=W*.72;radius=H*.245;titleY=H*.15;}else{heroY=H*.60;leftX=W*.39;rightX=W*.67;radius=H*.285;titleY=H*.18;}
// Hero: a readable in-game merge moment, two planets rushing into the energy ring.
glow((leftX+rightX)/2,heroY,radius*1.9,'rgb(255,239,137)',.80);g.save();g.translate((leftX+rightX)/2,heroY);g.rotate(-.20);for(let i=0;i<3;i++){g.strokeStyle=`rgba(255,248,190,${.86-i*.2})`;g.lineWidth=(11-i*3)*U;g.setLineDash([16*U,10*U]);g.beginPath();g.ellipse(0,0,radius*(.96+i*.13),radius*(.29+i*.035),0,0,Math.PI*2);g.stroke();}g.setLineDash([]);g.restore();planet(leftX,heroY,radius,'#6ce8ff','#2169cf','ocean',-.22);planet(rightX,heroY,radius*.94,'#ffd37a','#f1663f','warm',.20);for(let i=0;i<18;i++){const a=i/18*Math.PI*2,rr=radius*(1.13+(i%3)*.12),x=(leftX+rightX)/2+Math.cos(a)*rr,y=heroY+Math.sin(a)*rr*.55;star(x,y,(1.2+i%3)*U,.9);}
// Chunky title: shadow, high-contrast outline and fill remain legible at 200px.
g.save();g.textAlign='center';g.textBaseline='middle';const fontSize=portrait?W*.145:square?W*.13:H*.145;g.font=`900 ${fontSize}px Arial Black, Impact, sans-serif`;g.lineJoin='round';g.shadowColor='rgba(44,42,116,.66)';g.shadowBlur=0;g.shadowOffsetY=fontSize*.105;g.lineWidth=fontSize*.135;g.strokeStyle='#293273';g.strokeText('ASTRO',W*.5,titleY-fontSize*.39);g.strokeText('MERGE',W*.5,titleY+fontSize*.52);g.shadowOffsetY=0;g.lineWidth=fontSize*.06;g.strokeStyle='#fff2bd';g.strokeText('ASTRO',W*.5,titleY-fontSize*.39);g.strokeText('MERGE',W*.5,titleY+fontSize*.52);const letters=g.createLinearGradient(0,titleY-fontSize,0,titleY+fontSize);letters.addColorStop(0,'#ffffff');letters.addColorStop(.45,'#fff3a8');letters.addColorStop(1,'#ffb35f');g.fillStyle=letters;g.fillText('ASTRO',W*.5,titleY-fontSize*.39);g.fillText('MERGE',W*.5,titleY+fontSize*.52);g.restore();
document.title='ready';
</script>
</body>
</html>
